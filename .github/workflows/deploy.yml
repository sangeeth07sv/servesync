name: Deploy ServeSync
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: servesync-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:remote
      - name: Deploy and show live URL
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy-output.txt
          url=$(grep -oE 'https://[^[:space:]]+\\.workers\\.dev' deploy-output.txt | head -n 1 || true)
          if [ -n "$url" ]; then
            echo "## ServeSync live app" >> "$GITHUB_STEP_SUMMARY"
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment finished. Open Cloudflare Workers & Pages → servesync → Settings → Domains & Routes for its URL." >> "$GITHUB_STEP_SUMMARY"
          fi
